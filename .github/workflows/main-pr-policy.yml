# Enforces that pull requests into `main` only come from this repository's `dev` or
# `hotfix/*` branches; any other PR, including one from a fork, is closed automatically
# with an explanatory comment.
name: main-pr-policy

on:
  pull_request_target:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - edited
      - ready_for_review

permissions:
  pull-requests: write

jobs:
  enforce-source-branch:
    runs-on: ubuntu-22.04

    steps:
      - name: Close invalid pull request
        run: |
          head_ref="$HEAD_REF"
          head_repo="$HEAD_REPO"
          pr_number="${{ github.event.pull_request.number }}"
          repo="${{ github.repository }}"

          if [[ "$head_repo" == "$repo" && ( "$head_ref" == "dev" || "$head_ref" =~ ^hotfix/ ) ]]; then
            exit 0
          fi

          body='{"body":"Closing this PR automatically: pull requests into `main` must come from this repository'"'"'s `dev` or `hotfix/*` branches."}'
          state='{"state":"closed"}'

          curl --fail-with-body \
            --request POST \
            --url "https://api.github.com/repos/${repo}/issues/${pr_number}/comments" \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$body"

          curl --fail-with-body \
            --request PATCH \
            --url "https://api.github.com/repos/${repo}/pulls/${pr_number}" \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$state"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
